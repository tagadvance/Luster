name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the compile target and the floor. The others prove the library still behaves on a
        # newer runtime -- which matters here, because several decisions in this codebase turn on
        # virtual-thread and JDK-version behaviour.
        java: [ '17', '21', '25' ]

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      # The toolchain always compiles to 17; -PtestJavaVersion only moves the JVM the tests run on.
      - run: ./gradlew build -PtestJavaVersion=${{ matrix.java }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java-${{ matrix.java }}
          path: luster/build/reports/tests/test

  # Single required status check for the branch ruleset, so the matrix can
  # change without editing the ruleset.
  ci:
    name: CI
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
